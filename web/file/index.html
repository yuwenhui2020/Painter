<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>文件传输 · 局域网共享</title>
  <link rel="stylesheet" href="/file/file.css" />
</head>
<body>
  <header>
    <div class="title">文件传输</div>
    <div id="status" class="status">连接中…</div>
  </header>

  <section class="bar">
    <button id="up">上级</button>
    <button id="mkdir">新建文件夹</button>
    <button id="pick" class="primary">上传文件</button>
    <input id="file" type="file" multiple class="vis-hidden" />
    <div id="path" class="path">/</div>
  </section>

  <section class="list-wrap">
    <table class="list">
      <thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">空文件夹</div>
  </section>

  <div id="drop" class="drop hidden"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modal-title">预览</span><button id="modal-close">关闭</button></div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/file/file.js"></script>
</body>
</html>
